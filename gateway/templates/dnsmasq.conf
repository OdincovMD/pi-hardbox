# DHCP only. DNS traffic is transparently carried through Xray.
port=0
interface=wlan0
bind-dynamic
dhcp-authoritative
dhcp-range=10.77.0.100,10.77.0.200,255.255.255.0,12h
dhcp-option=option:router,10.77.0.1
dhcp-option=option:dns-server,1.1.1.1,9.9.9.9
dhcp-leasefile=/var/lib/hardbox-vpn/dhcp.leases
pid-file=/run/hardbox-vpn-dhcp/dnsmasq.pid
user=root
group=root
log-facility=-
